{% extends 'gestion/base.html' %}
{% block content %}
<h2>Eliminar Departamento</h2>
<p>¿Estás seguro de eliminar "{{ departamento.nombre }}"? Esta acción eliminará todos los empleados asociados.</p>
<form method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Sí, eliminar</button>
    <a href="{% url 'departamento_list' %}" class="btn btn-secondary">Cancelar</a>
</form>
{% endblock %}
